name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Check formatting
        run: |
          files="$(gofmt -l $(find . -name '*.go'))"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
